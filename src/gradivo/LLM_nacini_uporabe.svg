<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 810" width="1600" height="810" font-family="Calibri, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d2f40"/>
    </marker>
    <marker id="arrowStart" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#1d2f40"/>
    </marker>
    <marker id="arrowCoral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c5003e"/>
    </marker>
  </defs>

  <style>
    .panel  { fill: #ffffff; stroke: #d6dee0; stroke-width: 2; }
    .badge  { fill: #c5003e; }
    .badgeT { fill: #ffffff; font-size: 20px; font-weight: 700; text-anchor: middle; }
    .title  { fill: #c5003e; font-size: 24px; font-weight: 700; }
    .box    { fill: #eef1f3; stroke: #c1ccd1; stroke-width: 2; }
    .boxT   { fill: #131e29; font-size: 19px; text-anchor: middle; }
    .llm    { fill: #1d2f40; stroke: #1d2f40; stroke-width: 2; }
    .llmT   { fill: #ffffff; font-size: 21px; font-weight: 700; text-anchor: middle; }
    .llmS   { fill: #d6dee0; font-size: 14px; text-anchor: middle; }
    .src    { fill: #f7f9fa; stroke: #9fb0b8; stroke-width: 2; }
    .srcSem { fill: #ffffff; stroke: #c5003e; stroke-width: 2.5; }
    .ghost  { fill: none; stroke: #c1ccd1; stroke-width: 2; stroke-dasharray: 7 6; }
    .ghostT { fill: #8a9aa2; font-size: 16px; font-style: italic; text-anchor: middle; }
    .flow   { stroke: #1d2f40; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    .flow2  { stroke: #1d2f40; stroke-width: 2.5; fill: none; marker-end: url(#arrow); marker-start: url(#arrowStart); }
    .flowS  { stroke: #c5003e; stroke-width: 2.5; fill: none; marker-end: url(#arrowCoral); marker-start: url(#arrowStart); }
    .qlang  { fill: #1d2f40; font-size: 14px; font-style: italic; text-anchor: middle; }
    .qlangS { fill: #c5003e; font-size: 14px; font-style: italic; font-weight: 700; text-anchor: middle; }
    .note   { fill: #131e29; font-size: 16px; }
    .ok     { fill: #1d2f40; font-size: 17px; font-weight: 700; }
    .warn   { fill: #f9423a; font-size: 17px; font-weight: 700; }
    .gnode  { fill: #c5003e; }
    .gedge  { stroke: #c5003e; stroke-width: 2; }
  </style>

  <!-- ============ (a) Samo LLM ============ -->
  <rect class="panel" x="1" y="1" width="515" height="378" rx="14"/>
  <circle class="badge" cx="45" cy="45" r="19"/>
  <text class="badgeT" x="45" y="52">a</text>
  <text class="title" x="77" y="53">Samo LLM</text>

  <rect class="box" x="58" y="92" width="200" height="44" rx="9"/>
  <text class="boxT" x="158" y="120">Vprašanje</text>

  <rect class="llm" x="58" y="162" width="200" height="62" rx="9"/>
  <text class="llmT" x="158" y="189">LLM</text>
  <text class="llmS" x="158" y="210">naučeno znanje</text>

  <rect class="box" x="58" y="262" width="200" height="44" rx="9"/>
  <text class="boxT" x="158" y="290">Odgovor</text>

  <path class="flow" d="M 158 136 L 158 158"/>
  <path class="flow" d="M 158 224 L 158 258"/>

  <rect class="ghost" x="300" y="162" width="186" height="62" rx="9"/>
  <text class="ghostT" x="393" y="189">brez zunanjega</text>
  <text class="ghostT" x="393" y="209">vira podatkov</text>

  <text class="warn" x="30" y="334">⚠</text>
  <text class="note" x="52" y="334">znanje je iz učenja in lahko zastarelo,</text>
  <text class="warn" x="30" y="358">⚠</text>
  <text class="note" x="52" y="358">ni vira in ni sledljivosti odgovora.</text>

  <!-- ============ (b) LLM z relacijsko bazo ============ -->
  <rect class="panel" x="542" y="1" width="515" height="378" rx="14"/>
  <circle class="badge" cx="586" cy="45" r="19"/>
  <text class="badgeT" x="586" y="52">b</text>
  <text class="title" x="618" y="53">LLM z relacijsko bazo</text>

  <rect class="box" x="599" y="92" width="200" height="44" rx="9"/>
  <text class="boxT" x="699" y="120">Vprašanje</text>

  <rect class="llm" x="599" y="162" width="200" height="62" rx="9"/>
  <text class="llmT" x="699" y="189">LLM</text>
  <text class="llmS" x="699" y="210">tvori poizvedbo</text>

  <rect class="box" x="599" y="262" width="200" height="44" rx="9"/>
  <text class="boxT" x="699" y="290">Odgovor</text>

  <path class="flow" d="M 699 136 L 699 158"/>
  <path class="flow" d="M 699 224 L 699 258"/>

  <!-- cilinder baze -->
  <path class="src" d="M 846 178 a 82 13 0 0 1 164 0 v 46 a 82 13 0 0 1 -164 0 z"/>
  <ellipse class="src" cx="928" cy="178" rx="82" ry="13"/>
  <text class="boxT" x="928" y="207" font-size="17">Relacijska baza</text>

  <path class="flow2" d="M 803 193 L 842 193"/>
  <text class="qlang" x="822" y="152">SQL</text>

  <text class="ok" x="571" y="334">✓</text>
  <text class="note" x="593" y="334">prave in aktualne vrednosti iz baze,</text>
  <text class="warn" x="571" y="358">⚠</text>
  <text class="note" x="593" y="358">shema sama ne nosi pomena (POL_TYP_CD).</text>

  <!-- ============ (c) LLM z grafom znanja ============ -->
  <rect class="panel" x="1083" y="1" width="515" height="378" rx="14"/>
  <circle class="badge" cx="1127" cy="45" r="19"/>
  <text class="badgeT" x="1127" y="52">c</text>
  <text class="title" x="1159" y="53">LLM z grafom znanja</text>

  <rect class="box" x="1140" y="92" width="200" height="44" rx="9"/>
  <text class="boxT" x="1240" y="120">Vprašanje</text>

  <rect class="llm" x="1140" y="162" width="200" height="62" rx="9"/>
  <text class="llmT" x="1240" y="189">LLM</text>
  <text class="llmS" x="1240" y="210">tvori poizvedbo</text>

  <rect class="box" x="1140" y="262" width="200" height="44" rx="9"/>
  <text class="boxT" x="1240" y="290">Odgovor + vir</text>

  <path class="flow" d="M 1240 136 L 1240 158"/>
  <path class="flow" d="M 1240 224 L 1240 258"/>

  <rect class="srcSem" x="1382" y="158" width="186" height="70" rx="9"/>
  <text class="boxT" x="1475" y="184">Graf znanja</text>
  <!-- glif grafa -->
  <line class="gedge" x1="1441" y1="207" x2="1475" y2="197"/>
  <line class="gedge" x1="1475" y1="197" x2="1509" y2="207"/>
  <line class="gedge" x1="1441" y1="207" x2="1509" y2="207"/>
  <circle class="gnode" cx="1441" cy="207" r="5.5"/>
  <circle class="gnode" cx="1475" cy="197" r="5.5"/>
  <circle class="gnode" cx="1509" cy="207" r="5.5"/>

  <path class="flowS" d="M 1344 193 L 1378 193"/>
  <text class="qlangS" x="1361" y="152">SPARQL</text>

  <text class="ok" x="1112" y="334">✓</text>
  <text class="note" x="1134" y="334">pojmi imajo pomen in so povezani med viri,</text>
  <text class="ok" x="1112" y="358">✓</text>
  <text class="note" x="1134" y="358">odgovor je sledljiv do izvornega trojčka.</text>

  <!-- ============ (d) Agentni sistem ============ -->
  <rect class="panel" x="1" y="409" width="1597" height="400" rx="14"/>
  <circle class="badge" cx="45" cy="453" r="19"/>
  <text class="badgeT" x="45" y="460">d</text>
  <text class="title" x="77" y="461">LLM kot del agentnega sistema (MCP)</text>

  <rect class="box" x="40" y="578" width="150" height="54" rx="9"/>
  <text class="boxT" x="115" y="611">Uporabnik</text>

  <rect class="llm" x="240" y="566" width="210" height="78" rx="9"/>
  <text class="llmT" x="345" y="598">Agent (LLM)</text>
  <text class="llmS" x="345" y="621">načrtuje in izbira orodja</text>

  <rect class="box" x="500" y="566" width="220" height="78" rx="9"/>
  <text class="boxT" x="610" y="598">MCP strežniki</text>
  <text class="boxT" x="610" y="622" font-size="14" fill="#5b6b74">dostop do orodij</text>

  <path class="flow" d="M 194 605 L 236 605"/>
  <path class="flow2" d="M 454 605 L 496 605"/>

  <rect class="srcSem" x="780" y="470" width="330" height="56" rx="9"/>
  <text class="boxT" x="945" y="504">Graf znanja (RDF)</text>

  <rect class="src" x="780" y="542" width="330" height="56" rx="9"/>
  <text class="boxT" x="945" y="576">Relacijske baze</text>

  <rect class="src" x="780" y="614" width="330" height="56" rx="9"/>
  <text class="boxT" x="945" y="648">Dokumenti in vektorska baza</text>

  <rect class="src" x="780" y="686" width="330" height="56" rx="9"/>
  <text class="boxT" x="945" y="720">Storitve in vmesniki API</text>

  <path class="flow2" d="M 726 596 C 752 558, 754 512, 776 498"/>
  <path class="flow2" d="M 726 600 C 752 584, 754 576, 776 570"/>
  <path class="flow2" d="M 726 610 C 752 626, 754 634, 776 642"/>
  <path class="flow2" d="M 726 614 C 752 652, 754 700, 776 714"/>

  <path class="flow" d="M 345 648 L 345 676 L 220 676 L 220 700"/>
  <path class="flow" d="M 345 648 L 345 676 L 530 676 L 530 700"/>

  <rect class="box" x="60" y="702" width="320" height="52" rx="9"/>
  <text class="boxT" x="220" y="734">Odgovor z navedbo virov</text>

  <rect class="box" x="400" y="702" width="320" height="52" rx="9"/>
  <text class="boxT" x="560" y="734">Dejanje z revizijsko sledjo</text>

  <text class="ok" x="1180" y="504">✓</text>
  <text class="note" x="1202" y="504">agent hkrati doseže več virov in sam izbere orodje,</text>
  <text class="ok" x="1180" y="546">✓</text>
  <text class="note" x="1202" y="546">poleg odgovora lahko izvede tudi dejanje,</text>
  <text class="warn" x="1180" y="588">⚠</text>
  <text class="note" x="1202" y="588">zato potrebuje tipiziran model objektov,</text>
  <text class="warn" x="1180" y="630">⚠</text>
  <text class="note" x="1202" y="630">opredeljene dovoljene akcije in revizijsko sled.</text>
  <text class="note" x="1202" y="694" font-style="italic" fill="#5b6b74">Semantika tu ni okras, ampak</text>
  <text class="note" x="1202" y="716" font-style="italic" fill="#5b6b74">pogoj za zaupanje dejanju.</text>
</svg>
